<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sève, Maison de parfum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F8; --surface:#FFFFFF; --soft:#EFEBF1; --ink:#1E1622; --muted:#6A5E70;
  --plum:#33203A; --on-plum:#F4EEF6; --iris:#6E4F8C; --moss:#7C8240; --line:#E3DCE7;
  --on-ink:#F7F6F8; --glass:#ffffff;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151017; --surface:#1D1620; --soft:#241B28; --ink:#EFE8F2; --muted:#AFA2B6;
    --plum:#2A1A31; --on-plum:#F4EEF6; --iris:#B79AD6; --moss:#B8BE78; --line:#342839; --on-ink:#151017; --glass:#d9d2de;
  }
}
:root[data-theme="dark"]{
  --bg:#151017; --surface:#1D1620; --soft:#241B28; --ink:#EFE8F2; --muted:#AFA2B6;
  --plum:#2A1A31; --on-plum:#F4EEF6; --iris:#B79AD6; --moss:#B8BE78; --line:#342839; --on-ink:#151017; --glass:#d9d2de;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:1.0625rem;line-height:1.6;overflow-x:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--iris);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* announcement + header */
.announce{background:var(--plum);color:var(--on-plum);text-align:center;font-size:.82rem;padding:.5rem 1rem;letter-spacing:.02em}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:.9rem 1.5rem;max-width:1240px;margin:0 auto}
.hdr nav{display:flex;gap:1.6rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.hdr nav a{text-decoration:none;color:var(--muted)}
.hdr nav a:hover{color:var(--ink)}
.logo{font-family:var(--display);font-size:1.9rem;text-decoration:none;letter-spacing:.18em;font-weight:500;text-align:center;line-height:1}
.logo small{display:block;font-family:var(--body);font-size:.58rem;letter-spacing:.42em;color:var(--muted);margin-top:.3rem;font-weight:400}
.hdr-r{display:flex;justify-content:flex-end;align-items:center;gap:1rem}
.lang{display:flex;font-size:.8rem;letter-spacing:.1em}
.lang button{background:none;border:0;padding:.25rem .4rem;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.icon-btn{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:.35rem;padding:.3rem;font-size:.85rem}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.3}
.count{min-width:1.2rem;height:1.2rem;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:.7rem;display:inline-grid;place-items:center;padding:0 .3rem}
@media (max-width:860px){.hdr nav{display:none}.hdr-in{grid-template-columns:auto 1fr;}.logo{text-align:left}.logo small{display:none}}

/* hero */
.hero{background:var(--plum);color:var(--on-plum);overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.05fr 1fr;min-height:min(78vh,720px);align-items:center;gap:2rem}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,6.4vw,5.6rem);line-height:1.02;margin:0 0 1.5rem;letter-spacing:-.01em}
.hero p{max-width:40ch;opacity:.82;margin:0 0 2.2rem;font-size:1.1rem}
.hero-art{position:relative;height:100%;min-height:420px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3rem}
.hero-art .b{position:relative;opacity:0;transform:translateY(24px);animation:up 1.2s cubic-bezier(.2,.7,.2,1) forwards}
.hero-art .b1{width:26%;animation-delay:.15s;margin-right:-4%}
.hero-art .b2{width:38%;animation-delay:.35s;z-index:2}
.hero-art .b3{width:26%;animation-delay:.55s;margin-left:-4%}
.hero-art::after{content:"";position:absolute;left:12%;right:12%;bottom:2.4rem;height:28px;background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);filter:blur(4px)}
@keyframes up{to{opacity:1;transform:none}}
@media (max-width:860px){.hero-in{grid-template-columns:1fr;padding-top:3rem}.hero-art{min-height:320px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);padding:.9rem 1.8rem;text-decoration:none;cursor:pointer;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400;border-radius:0}
.btn.light{background:var(--on-plum);color:var(--plum);border-color:var(--on-plum)}
.btn.outline{background:transparent;color:var(--ink)}
.btn.outline-light{background:transparent;color:var(--on-plum);border-color:color-mix(in srgb,var(--on-plum) 50%,transparent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.btns{display:flex;gap:.75rem;flex-wrap:wrap}

/* promises */
.promises{border-bottom:1px solid var(--line)}
.promises ul{list-style:none;margin:0;padding:1.6rem 0;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;font-size:.92rem;color:var(--muted);text-align:center}
.promises strong{display:block;color:var(--ink);font-weight:400;font-family:var(--display);font-size:1.1rem}
@media (max-width:760px){.promises ul{grid-template-columns:1fr 1fr}}

section{padding:6rem 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:2rem;flex-wrap:wrap;margin-bottom:2.5rem}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.08;margin:0}
.lede{color:var(--muted);max-width:52ch;margin:.8rem 0 0}

/* filters + grid */
.filters{display:flex;gap:.4rem;flex-wrap:wrap}
.filters button{background:none;border:1px solid var(--line);padding:.45rem 1rem;cursor:pointer;font-size:.88rem;color:var(--muted);border-radius:999px}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem 1.5rem}
@media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.card .ph{aspect-ratio:4/5;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12%;position:relative;overflow:hidden;transition:background .4s}
.card .ph svg{width:38%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph svg{transform:translateY(-6px)}
.card .badge{position:absolute;top:1rem;left:1rem;font-size:.75rem;background:var(--surface);padding:.2rem .6rem;color:var(--ink)}
.card h3{font-family:var(--display);font-weight:400;font-size:1.55rem;margin:1rem 0 .1rem}
.card .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.93rem}
.card .keys{font-size:.9rem;color:var(--muted);margin-top:.25rem}

/* AI atelier tabs */
.atelier{background:var(--soft)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:2.5rem;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:.9rem 1.3rem;cursor:pointer;font-size:.95rem;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start}
.panel[hidden]{display:none}
@media (max-width:860px){.panel{grid-template-columns:1fr;gap:2rem}}
.panel h3{font-family:var(--display);font-weight:400;font-size:2rem;margin:0 0 .5rem}
.panel .intro{color:var(--muted);margin:0 0 1.75rem;max-width:44ch}
.q{border:0;margin:0 0 1.5rem;padding:0}
.q legend,.lbl{font-size:.95rem;margin-bottom:.6rem;padding:0;display:block;font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:.45rem}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-block;border:1px solid var(--line);background:var(--surface);padding:.45rem 1rem;font-size:.92rem;border-radius:999px}
.opts input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opts input:focus-visible + span{outline:2px solid var(--iris);outline-offset:2px}
.field{width:100%;border:1px solid var(--line);background:var(--surface);padding:.75rem .9rem;border-radius:0}
textarea.field{min-height:5rem;resize:vertical}
.fgroup{margin-bottom:1.25rem}
.res{background:var(--surface);border:1px solid var(--line);padding:2rem;min-height:320px;display:flex;flex-direction:column}
.res .empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch}
.res .empty svg{width:70px;opacity:.6;margin-bottom:1rem}
.res-top{display:flex;gap:1.5rem;align-items:center;margin-bottom:1.25rem}
.res-top svg{width:72px;flex:none}
.res-name{font-family:var(--display);font-size:2rem;line-height:1.1;margin:0}
.res-fam{color:var(--muted);font-size:.92rem;margin:.2rem 0 0}
.res p{margin:0 0 1rem}
.cardmsg{border:1px solid var(--line);padding:1.25rem 1.5rem;font-family:var(--display);font-style:italic;font-size:1.15rem;line-height:1.5;margin:0 0 1.25rem;background:var(--bg)}
.small{font-size:.85rem;color:var(--muted)}
.status{color:var(--muted);font-style:italic;margin:auto;text-align:center}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.verdict{display:inline-block;font-size:.8rem;padding:.2rem .7rem;border:1px solid var(--moss);color:var(--moss);margin-bottom:.8rem;border-radius:999px}
.pair{display:flex;align-items:flex-end;gap:.5rem;margin-bottom:1rem}
.pair svg{width:56px}
.pair span{font-family:var(--display);font-size:1.6rem;padding-bottom:1rem;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* story */
.story{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.story-art{background:var(--plum);aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.story-art svg{width:70%}
.story blockquote{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.3;margin:0 0 1.5rem;font-weight:400}
.story p{color:var(--muted);max-width:50ch}
@media (max-width:860px){.story{grid-template-columns:1fr;gap:2rem}}

/* studio */
.studio details{border:1px solid var(--line);background:var(--surface)}
.studio summary{cursor:pointer;padding:1.5rem 2rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.studio summary::-webkit-details-marker{display:none}
.studio summary h2{font-size:1.8rem}
.studio summary .small{display:block;margin-top:.3rem}
.studio .plus{font-size:1.6rem;color:var(--muted);transition:transform .3s}
.studio details[open] .plus{transform:rotate(45deg)}
.studio-body{padding:0 2rem 2rem}
.studio .panel{grid-template-columns:1fr 1.1fr}
.out h4{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:1.2rem 0 .4rem}
.out h4:first-child{margin-top:0}
.out p{margin:0 0 .5rem}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);padding:0 .45rem;margin-right:.5rem;color:var(--muted);vertical-align:middle;font-family:var(--body)}

/* newsletter + footer */
.news{background:var(--plum);color:var(--on-plum);text-align:center}
.news h2{margin-bottom:.8rem}
.news p{opacity:.8;margin:0 auto 2rem;max-width:46ch}
.news form{display:flex;max-width:460px;margin:0 auto;border-bottom:1px solid color-mix(in srgb,var(--on-plum) 50%,transparent)}
.news input{flex:1;background:none;border:0;color:var(--on-plum);padding:.8rem 0}
.news input::placeholder{color:color-mix(in srgb,var(--on-plum) 60%,transparent)}
.news button{background:none;border:0;color:var(--on-plum);cursor:pointer;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
.news .ok{margin-top:1rem;min-height:1.5em;font-size:.95rem}
footer{padding:4rem 0 3rem;font-size:.92rem;color:var(--muted)}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem;margin-bottom:3rem}
.fcols h4{color:var(--ink);font-weight:400;margin:0 0 .8rem;font-size:.95rem}
.fcols ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.fcols a{text-decoration:none}
.fcols a:hover{color:var(--ink)}
.fbase{border-top:1px solid var(--line);padding-top:1.5rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;font-size:.82rem}
@media (max-width:760px){.fcols{grid-template-columns:1fr 1fr}}

/* dialogs (product + bag) */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(20,10,24,.45);backdrop-filter:blur(2px)}
.pd{width:min(1040px,94vw);height:min(760px,92vh);margin:auto}
.pd-in{display:grid;grid-template-columns:1fr 1fr;height:100%}
.pd-art{display:flex;align-items:flex-end;justify-content:center;padding-bottom:12%;position:relative}
.pd-art svg{width:42%}
.pd-body{padding:2.5rem;overflow-y:auto}
.pd h2{font-size:2.6rem}
.pd .fam{color:var(--muted);margin:.25rem 0 1.5rem}
.pyr{display:grid;gap:0;margin:1.5rem 0;border-top:1px solid var(--line)}
.pyr div{display:grid;grid-template-columns:5.5rem 1fr;padding:.7rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.pyr dt{color:var(--muted)} .pyr dd{margin:0}
.sizes{display:flex;gap:.5rem;margin:1.5rem 0 1rem}
.sizes label{flex:1;cursor:pointer}
.sizes input{position:absolute;opacity:0}
.sizes span{display:block;border:1px solid var(--line);padding:.8rem;text-align:center;font-size:.92rem}
.sizes input:checked + span{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sizes input:focus-visible + span{outline:2px solid var(--iris)}
.close{position:absolute;top:1rem;right:1rem;background:var(--surface);border:1px solid var(--line);width:40px;height:40px;cursor:pointer;font-size:1.2rem;z-index:3}
.reviews{margin-top:2.5rem}
.reviews h3{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 .75rem}
.stars{color:var(--iris);letter-spacing:.1em}
.rv{border-bottom:1px solid var(--line);padding:.9rem 0;font-size:.95rem}
.rv b{font-weight:400}
.ai-sum{background:var(--soft);padding:1.1rem 1.25rem;margin:.75rem 0 1rem;font-size:.95rem}
.ai-sum:empty{display:none}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;font-size:.9rem;color:var(--iris)}
@media (max-width:760px){.pd{height:94vh}.pd-in{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow-y:auto}.pd-art{height:300px}.pd-art svg{width:28%}.pd-body{overflow:visible;padding:1.75rem}}
.bag{width:min(440px,100vw);height:100%;margin:0 0 0 auto;max-height:100vh}
.bag-in{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bag-h{display:flex;justify-content:space-between;align-items:center;padding:1.5rem;border-bottom:1px solid var(--line)}
.bag-h h2{font-size:1.6rem}
.bag-list{flex:1;overflow-y:auto;padding:0 1.5rem}
.bi{display:grid;grid-template-columns:64px 1fr auto;gap:1rem;padding:1.2rem 0;border-bottom:1px solid var(--line);align-items:center}
.bi .th{background:var(--soft);height:80px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.bi .th svg{width:50%}
.bi b{font-family:var(--display);font-weight:400;font-size:1.15rem;display:block}
.qty{display:flex;align-items:center;gap:.5rem;margin-top:.3rem}
.qty button{background:none;border:1px solid var(--line);width:26px;height:26px;cursor:pointer}
.bag-f{padding:1.5rem;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;margin-bottom:1rem;font-size:1.05rem}
.bag-empty{text-align:center;color:var(--muted);padding:4rem 1rem}

/* concierge */
.fab{position:fixed;right:1.25rem;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--on-ink);border:0;border-radius:999px;padding:.85rem 1.3rem;cursor:pointer;display:flex;align-items:center;gap:.6rem;font-size:.9rem;box-shadow:0 10px 30px rgba(20,10,24,.25)}
.fab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5}
.chat{position:fixed;right:1.25rem;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));z-index:31;width:min(400px,calc(100vw - 2.5rem));height:min(600px,calc(100vh - 7rem));background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(20,10,24,.25)}
.chat[hidden]{display:none}
.chat-h{background:var(--plum);color:var(--on-plum);padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center}
.chat-h b{font-family:var(--display);font-weight:400;font-size:1.25rem;display:block}
.chat-h span{font-size:.8rem;opacity:.75}
.chat-h button{background:none;border:0;color:var(--on-plum);font-size:1.3rem;cursor:pointer}
.log{flex:1;overflow-y:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.7rem}
.msg{max-width:86%;padding:.7rem .95rem;white-space:pre-wrap;line-height:1.5;font-size:.95rem}
.msg.bot{background:var(--soft);align-self:flex-start}
.msg.me{background:var(--ink);color:var(--on-ink);align-self:flex-end}
.msg.sys{align-self:center;font-size:.8rem;color:var(--moss);background:none;padding:.2rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 1.1rem .8rem}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:.3rem .8rem;font-size:.82rem;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chat form{display:flex;border-top:1px solid var(--line)}
.chat input{flex:1;border:0;background:none;padding:1rem 1.1rem}
.chat form button{background:none;border:0;padding:0 1.1rem;cursor:pointer;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:.75rem 1.25rem;font-size:.9rem;opacity:0;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.noai{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);padding:.8rem 1rem;margin-top:1rem;display:none}
body.no-ai .noai{display:block}
</style>
</head>
<body>

<div class="announce" data-i="announce"></div>
<header class="hdr">
  <div class="hdr-in">
    <nav aria-label="Menu">
      <a href="#collection" data-i="navColl"></a>
      <a href="#atelier" data-i="navAtelier"></a>
      <a href="#maison" data-i="navMaison"></a>
    </nav>
    <a class="logo" href="#top">SÈVE<small>ANTIBES</small></a>
    <div class="hdr-r">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="icon-btn" id="bagBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="sr" data-i="bag"></span><span class="count" id="bagCount">0</span>

function renderTabs(){

/* ================= BAG ================= */
function saveBag(){ try{localStorage.setItem("seve-bag",JSON.stringify(bag));}catch(e){} }
function addToBag(id,size=0,silent){
  const p=byId(id); if(!p) return false; size=size===1?1:0;
  const it=bag.find(x=>x.id===id&&x.size===size); if(it) it.qty++; else bag.push({id,size,qty:1});
  saveBag(); renderBag(); if(!silent) toast(`${p.name} ${size?100:50} ml · ${t("added")}`); return true;
}
function renderBag(){
  const n=bag.reduce((a,x)=>a+x.qty,0); $("#bagCount").textContent=n;
  if(!bag.length){ $("#bagList").innerHTML=`<p class="bag-empty">${t("bagEmpty")}</p>`; $("#bagFoot").innerHTML=""; return; }
  $("#bagList").innerHTML=bag.map((x,i)=>{const p=byId(x.id); return `<div class="bi"><div class="th" style="background:${dark()?p.tintD:p.tint}">${bottle(p)}</div>
    <div><b>${esc(p.name)}</b><span class="small">${x.size?100:50} ml</span><div class="qty"><button type="button" data-i2="${i}" data-d="-1" aria-label="-">−</button><span>${x.qty}</span><button type="button" data-i2="${i}" data-d="1" aria-label="+">+</button></div></div>
    <span>${p.p[x.size]*x.qty} €</span></div>`;}).join("");
  const sub=bag.reduce((a,x)=>a+byId(x.id).p[x.size]*x.qty,0);
  const ship=sub>=FREE_SHIPPING_FROM?0:SHIPPING_PRICE;
  const eur=n=>n.toFixed(2).replace(".00","").replace(".",lang==="fr"?",":".")+" €";
  $("#bagFoot").innerHTML=`<div class="total small" style="margin-bottom:.4rem"><span>${t("subtotal")}</span><span>${eur(sub)}</span></div>
    <div class="total small" style="margin-bottom:.8rem"><span>${t("shipping")}</span><span>${ship?eur(ship):t("shipFree")}</span></div>
    <div class="total"><span>${t("total")}</span><span>${eur(sub+ship)}</span></div>
    <button class="btn full" type="button" id="checkout">${t("payBtn")}</button>
    <a class="btn outline full" style="margin-top:.6rem" id="waOrder" target="_blank" rel="noopener">${t("waBtn")}</a>
    <p class="small" style="margin:.8rem 0 0;text-align:center">${t("secure")}</p>`;
  $("#checkout").onclick=startCheckout;
  const lines=bag.map(x=>`- ${byId(x.id).name} ${x.size?100:50} ml x${x.qty}`).join("\n");
  $("#waOrder").href=`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(t("waHello")+"\n"+lines)}`;
  $("#bagList").querySelectorAll("[data-i2]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i2; bag[i].qty+=+b.dataset.d; if(bag[i].qty<=0) bag.splice(i,1); saveBag(); renderBag();});
}

$("#bag").addEventListener("click",e=>{ if(e.target===$("#bag")) $("#bag").close(); });

/* ================= PAYMENT ================= */
async function startCheckout(){
  const b=$("#checkout"); b.disabled=true; b.textContent=t("redirect");
  try{
    const r=await fetch("/api/checkout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:bag,lang})});

    if(!r.ok||!d.url) throw 0;
    window.location.href=d.url;
  }catch(e){ toast(t("payErr")); b.disabled=false; b.textContent=t("payBtn"); }
}
(function(){
  const q=new URLSearchParams(location.search);
  if(q.get("paid")==="1"){ bag=[]; saveBag(); setTimeout(()=>toast(t("paidMsg")),600); }
  if(q.get("canceled")==="1"){ setTimeout(()=>{toast(t("canceledMsg")); $("#bag").showModal();},600); }
  if(q.has("paid")||q.has("canceled")) history.replaceState(null,"",location.pathname);
})();

/* ================= AI CORE ================= */
/* Standalone version: AI calls go to our own server function (/api/claude), which holds the API key. */
async function callAI(messages, tier){
  const res = await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,tier})});
  if(res.status===429) throw {code:"rate_limited"};
  if(!res.ok) throw {code:"server_error"};
  const d = await res.json(); return d.text||"";
}
sample = async (input, opts={}) => {
  const messages = typeof input==="string" ? [{role:"user",content:input}] : input;
  const text = await callAI(messages, opts.modelTier);
  if(opts.onText) opts.onText({text, delta:text});
  return {text, truncated:false};
};
sample.json = async (input, opts={}) => {
  const {text} = await sample(input, opts);
  const m = text.replace(/```json|```/g,"").match(/\{[\s\S]*\}/);
  if(!m) throw {code:"bad_json"};
  return JSON.parse(m[0]);
};
function errCopy(e){ if(e&&e.code==="not_granted") return t("errDeclined"); if(e&&e.code==="rate_limited") return t("errBusy"); return t("errOther"); }
const LN=()=>lang==="fr"?"French":"English";
function catalogText(){ return CATALOG.map(p=>`- id: ${p.id} | ${p.name} | ${p.famL.en} | top: ${p.top.en} | heart: ${p.heart.en} | base: ${p.base.en} | 50 ml €${p.p[0]}, 100 ml €${p.p[1]}`).join("\n"); }
const HOUSE="Sève is an artisan perfume house in Antibes, France. Tone: warm, refined, concise, sensory, like a knowledgeable boutique advisor at a luxury house. No em dashes. Never invent products, discounts or policies.";
function resultHead(p){ return `<div class="res-top">${bottle(p)}<div><p class="res-name">${esc(p.name)}</p><p class="res-fam">${p.famL[lang]} · ${t("from")} ${p.p[0]} €</p></div></div>`; }
function actionBtns(p){ const d=document.createElement("div"); d.className="btns"; d.style.marginTop="auto";
  const a=document.createElement("button"); a.type="button"; a.className="btn"; a.textContent=t("addBag"); a.onclick=()=>addToBag(p.id,0);
  const v=document.createElement("button"); v.type="button"; v.className="btn outline"; v.textContent=t("view"); v.onclick=()=>openProduct(p.id);
  d.append(a,v); return d; }
function para(txt,cls){ const e=document.createElement("p"); if(cls) e.className=cls; e.textContent=txt||""; return e; }

/* quiz */
$("#quizForm").addEventListener("submit",async ev=>{
  ev.preventDefault(); const out=$("#quizOut"); const ans={};
  for(const q of QUIZ){ const c=document.querySelector(`input[name="${q.id}"]:checked`); if(!c){ out.dataset.filled=1; out.innerHTML=`<p class="status">${t("quizMissing")}</p>`; return; } ans[q.id]=c.value; }
  if(!sample) return fail(out);
  const btn=ev.submitter||$("#quizForm button"); btn.disabled=true; busy(out);
  try{
    const r=await sample.json(`${HOUSE}\nCollection:\n${catalogText()}\n\nQuiz answers: ${JSON.stringify(ans)}\nScent memory: ${JSON.stringify($("#qMem").value.trim()||"(none)")}\n\nReturn ONLY JSON: {"pick":"<id>","reason":"<2-3 sentences in ${LN()} linking their answers and memory to specific notes>","runnerUp":"<different id>","runnerReason":"<1 sentence in ${LN()}>"}`,{modelTier:"quick"});
    const p=byId(r.pick)||CATALOG[0]; const ru=byId(r.runnerUp);
    out.innerHTML=resultHead(p); out.append(para(r.reason));
    if(ru&&ru.id!==p.id){ const x=para("","small"); x.innerHTML=`<b style="font-weight:400;color:var(--ink)">${lang==="fr"?"Aussi pour vous":"Also for you"} : ${esc(ru.name)}.</b> `; x.append(r.runnerReason||""); out.append(x); }
    out.append(actionBtns(p));
  }catch(e){ fail(out,e); } finally{ btn.disabled=false; }
});

/* gift */
$("#giftForm").addEventListener("submit",async ev=>{
  ev.preventDefault(); const out=$("#giftOut"); if(!sample) { out.dataset.filled=1; return fail(out); }

  const budget=$("#gBudget").value;

    const p=byId(r.pick)||CATALOG[0];
    out.innerHTML=resultHead(p); out.append(para(r.why));

});

/* layering */
$("#layerForm").addEventListener("submit",async ev=>{
  ev.preventDefault(); const out=$("#layOut"); const a=byId($("#lA").value), b=byId($("#lB").value);
  if(a.id===b.id){ out.dataset.filled=1; out.innerHTML=`<p class="status">${t("laySame")}</p>`; return; }
  if(!sample){ out.dataset.filled=1; return fail(out); }
  const btn=ev.submitter||$("#layerForm button"); btn.disabled=true; busy(out);
  try{
    const r=await sample.json(`${HOUSE}\nYou are a perfumer advising on layering two of the house's perfumes.\nA: ${a.name} (top ${a.top.en}; heart ${a.heart.en}; base ${a.base.en})\nB: ${b.name} (top ${b.top.en}; heart ${b.heart.en}; base ${b.base.en})\nBe honest: if they clash, say so.\nReturn ONLY JSON, all text in ${LN()}: {"nickname":"<an evocative 2-4 word name for the blend>","verdict":"<one of: Harmonious / Bold / Not recommended, translated to ${LN()}>","result":"<2-3 sentences describing how the blend smells over time>","howto":"<1-2 sentences: which one first, how many sprays each, where>"}`,{modelTier:"quick"});
    out.innerHTML=`<div class="pair">${bottle(a)}<span>+</span>${bottle(b)}</div>`;
    const v=para(r.verdict,"verdict"); out.append(v);
    const n=para(r.nickname,"res-name"); n.style.marginBottom=".75rem"; out.append(n);
    out.append(para(r.result));
    const h=para("","small"); h.innerHTML=`<b style="font-weight:400;color:var(--ink)">${t("spray")} : </b>`; h.append(r.howto||""); out.append(h);
  }catch(e){ fail(out,e); } finally{ btn.disabled=false; }
});

/* moment */
$("#momForm").addEventListener("submit",async ev=>{
  ev.preventDefault(); const out=$("#momOut"); if(!sample){ out.dataset.filled=1; return fail(out); }
  const btn=ev.submitter||$("#momForm button"); btn.disabled=true; busy(out);
  try{
    const r=await sample.json(`${HOUSE}\nCollection:\n${catalogText()}\n\nThe customer describes an upcoming moment: ${JSON.stringify($("#mText").value.trim())}\nPick the best perfume for it, considering weather, setting, intimacy and outfit.\nReturn ONLY JSON, text in ${LN()}: {"pick":"<id>","why":"<2-3 sentences>","tip":"<one practical wearing tip for that moment, e.g. number of sprays or where>"}`,{modelTier:"quick"});
    const p=byId(r.pick)||CATALOG[0];
    out.innerHTML=resultHead(p); out.append(para(r.why)); out.append(para(r.tip,"small")); out.append(actionBtns(p));
  }catch(e){ fail(out,e); } finally{ btn.disabled=false; }
});

/* reviews summary */
async function summarizeReviews(p){
  const box=$("#aiSum"); const btn=$("#sumBtn");
  if(!sample){ box.textContent=t("noAi"); return; }
  btn.disabled=true; box.innerHTML=`<span class="dots">${t("thinking")}</span>`;
  try{
    await sample(`${HOUSE}\nSummarise these customer reviews of ${p.name} for a shopper, in ${LN()}, in 2 short sentences: what people love, and one honest caveat if any. Plain text only.\n${p.reviews.map(r=>`- ${r[1]}/5: ${r[2]}`).join("\n")}`,{modelTier:"quick",onText:({text})=>{box.textContent=text;}}).then(r=>box.textContent=r.text);
  }catch(e){ box.textContent=e.text||errCopy(e); } finally{ btn.disabled=false; }
}

/* studio */
let lastCopy="";
$("#studioForm").addEventListener("submit",async ev=>{
  ev.preventDefault(); const out=$("#stOut"); if(!sample){ out.dataset.filled=1; return fail(out); }
  const btn=ev.submitter||$("#studioForm button"); btn.disabled=true; busy(out);
  const name=$("#sName").value.trim(), kind=$("#sKind").value;
  const spec={product:"a product page: tagline (max 10 words), description (70-100 words), how to wear it (1-2 sentences)",
              instagram:"an Instagram caption: hook line, 2-3 short sensory lines, a call to action, 5-8 relevant hashtags",
              newsletter:"a launch newsletter: subject line, preview text, body of 90-130 words, button label"}[kind];
  try{
    const r=await sample.json(`${HOUSE}\nWrite ${spec} for a new perfume.\nName: ${name}\nNotes: ${$("#sNotes").value.trim()}\nInspiration: ${$("#sStory").value.trim()||"(none)"}\nTone: ${$("#sTone").value}\nNo clichés like "unleash", "embark", "elevate". The French must read as native French, not a translation.\nReturn ONLY JSON: {"fr":[{"label":"<section label in French>","text":"..."}],"en":[{"label":"<section label in English>","text":"..."}]}`,{modelTier:"default"});
    out.innerHTML=""; lastCopy=name;
    for(const code of ["fr","en"]){
      const h=document.createElement("h4"); h.innerHTML=`<span class="tag">${code.toUpperCase()}</span>`; h.append(name); out.append(h);
      lastCopy+=`\n\n[${code.toUpperCase()}]`;
      (r[code]||[]).forEach(s=>{ const pEl=document.createElement("p"); const b=document.createElement("b"); b.style.fontWeight="500"; b.textContent=s.label+" : "; pEl.append(b,s.text||""); out.append(pEl); lastCopy+=`\n${s.label}: ${s.text}`; });
    }
    const c=document.createElement("button"); c.type="button"; c.className="btn outline"; c.style.marginTop="1.25rem"; c.style.alignSelf="flex-start"; c.textContent=t("copy");
    c.onclick=async()=>{ try{ await navigator.clipboard.writeText(lastCopy); c.textContent=t("copied"); }catch(e){ const ta=document.createElement("textarea"); ta.value=lastCopy; document.body.append(ta); ta.select(); try{document.execCommand("copy"); c.textContent=t("copied");}catch(_){} ta.remove(); } };
    out.append(c);
  }catch(e){ fail(out,e); } finally{ btn.disabled=false; }
});

/* ================= CONCIERGE ================= */
let chatHistory=[], chatBusy=false;
function renderLog(){ $("#log").innerHTML=""; addMsg("bot",t("chatHello")); }
function addMsg(who,txt){ const d=document.createElement("div"); d.className="msg "+who; d.textContent=txt; $("#log").append(d); $("#log").scrollTop=$("#log").scrollHeight; return d; }
function renderChips(){ $("#chips").innerHTML=""; if(chatHistory.length) return; t("chips").forEach(c=>{const b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent=c; b.onclick=()=>{$("#chatIn").value=c; sendChat();}; $("#chips").append(b);}); }
$("#fab").onclick=()=>{ $("#chat").hidden=false; $("#fab").hidden=true; $("#chatIn").focus(); };
$("#chatClose").onclick=()=>{ $("#chat").hidden=true; $("#fab").hidden=false; $("#fab").focus(); };
async function sendChat(){
  const q=$("#chatIn").value.trim(); if(!q||chatBusy) return;
  $("#chatIn").value=""; $("#chips").innerHTML=""; addMsg("me",q);
  const bubble=addMsg("bot","…");
  if(!sample){ bubble.textContent=t("noAi"); return; }
  chatBusy=true; $("#chatBtn").disabled=true;
  const bagTxt=bag.length?bag.map(x=>`${byId(x.id).name} ${x.size?100:50}ml x${x.qty}`).join(", "):"empty";
  const sys=`${HOUSE}\nYou are the online boutique advisor. Collection:\n${catalogText()}\nCustomer's bag: ${bagTxt}.\nReply in the customer's language (default ${LN()}), 2-4 sentences, plain text, no markdown. Recommend at most two perfumes. If the customer clearly asks to add something to their bag, confirm briefly and put this tag alone on the last line: [[ADD <id> <50 or 100>]]. Never use the tag otherwise. For shipping, returns or stock questions, say the team answers at contact@seve-parfums.fr or on WhatsApp. Payment is by card (Stripe) at checkout; delivery is free from €100, otherwise €6.90.`;
  const convo=[{role:"user",content:sys+"\n\nCustomer: "+(chatHistory[0]?.content??q)}, ...chatHistory.slice(1)];
  if(chatHistory.length) convo.push({role:"user",content:q});
  try{
    const r=await sample(convo,{modelTier:"quick"});
    let reply=r.text;
    reply=reply.replace(/\[\[ADD\s+([a-z-]+)\s*(\d+)?\]\]/g,(m,id,ml)=>{ const s2=ml==="100"?1:0; if(addToBag(id,s2,true)) addMsg("sys",`${byId(id).name} ${s2?100:50} ml ${t("chatAdded")}`); return ""; }).trim();
    bubble.textContent=reply; $("#log").append(bubble);
    chatHistory.push({role:"user",content:q},{role:"assistant",content:reply});
    if(chatHistory.length>16) chatHistory=chatHistory.slice(-16);
  }catch(e){ bubble.textContent=e.text||errCopy(e); }
  finally{ chatBusy=false; $("#chatBtn").disabled=false; }
}
$("#chatForm").addEventListener("submit",e=>{e.preventDefault();sendChat();});
